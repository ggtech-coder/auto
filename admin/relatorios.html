<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — Painel Rota Certa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Relatórios</h1>
    </div>

    <div class="panel">
      <div class="toolbar">
        <div class="filters">
          <select id="tipoRelatorio">
            <option value="matriculas">Matrículas</option>
            <option value="aulasRealizadas">Aulas realizadas</option>
            <option value="faltas">Faltas</option>
            <option value="agendamentos">Todos os agendamentos</option>
            <option value="instrutores">Instrutores</option>
            <option value="veiculos">Veículos</option>
            <option value="novosAlunos">Novos alunos (30 dias)</option>
            <option value="crescimentoMensal">Crescimento mensal de matrículas</option>
            <option value="horariosMaisUsados">Horários mais utilizados</option>
          </select>
        </div>
        <div class="filters">
          <button class="btn btn-outline btn-sm" id="btnExportarCsv">Exportar CSV</button>
          <button class="btn btn-primary btn-sm" id="btnExportarPdf">Exportar PDF</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="tabelaRelatorio">
          <thead></thead>
          <tbody><tr><td>Selecione um relatório acima.</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script src="../js/admin/relatorios.js"></script>
</body>
</html>
