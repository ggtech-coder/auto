<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar Aula — Autoescola Rota Certa</title>
<meta name="description" content="Agende sua aula teórica ou prática online na Autoescola Rota Certa. Escolha categoria, instrutor, data e horário disponível.">
<link rel="canonical" href="https://rotacerta.com.br/agendamento.html">
<meta name="robots" content="index, follow">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
.slots { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
.slot-btn { padding: 0.55rem 1rem; border-radius: var(--radius-sm); border: 1.5px solid var(--color-line); background: #fff; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all var(--transition); }
.slot-btn:hover:not(:disabled) { border-color: var(--color-primary); }
.slot-btn.selected { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.slot-btn:disabled { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }
.step-badge { display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--color-ink);color:var(--color-signal);font-family:var(--font-display);font-weight:800;font-size:0.8rem;margin-right:0.5rem; }
</style>
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Início</a> / Agendar aula</p>
      <span class="eyebrow">Agendamento online</span>
      <h1>Escolha o melhor horário para sua aula</h1>
      <p class="lead" style="margin-top:0.5rem;">Selecione a categoria, o instrutor, a data e um horário disponível. Você recebe a confirmação na hora.</p>
    </div>
  </section>

  <section>
    <div class="container" style="max-width:760px;">
      <div class="card">
        <form id="agendamentoForm">

          <h3><span class="step-badge">1</span>Seus dados</h3>
          <div class="form-grid mt-md">
            <div class="form-field"><label for="nome">Nome completo</label><input type="text" id="nome" required></div>
            <div class="form-field"><label for="cpf">CPF</label><input type="text" id="cpf" required placeholder="000.000.000-00"></div>
          </div>
          <div class="form-grid">
            <div class="form-field"><label for="telefone">Telefone / WhatsApp</label><input type="tel" id="telefone" required placeholder="(11) 90000-0000"></div>
            <div class="form-field"><label for="email">E-mail</label><input type="email" id="email" required></div>
          </div>

          <h3 class="mt-md"><span class="step-badge">2</span>Detalhes da aula</h3>
          <div class="form-grid mt-md">
            <div class="form-field"><label for="categoria">Categoria da habilitação</label>
              <select id="categoria" required><option value="">Selecione</option></select>
            </div>
            <div class="form-field"><label for="tipoAula">Tipo de aula</label>
              <select id="tipoAula" required><option value="">Selecione</option></select>
            </div>
          </div>
          <div class="form-field">
            <label for="instrutor">Instrutor</label>
            <select id="instrutor" required><option value="">Selecione a categoria primeiro</option></select>
          </div>

          <h3 class="mt-md"><span class="step-badge">3</span>Data e horário</h3>
          <div class="form-field mt-md">
            <label for="data">Data desejada</label>
            <input type="date" id="data" required>
          </div>
          <div class="form-field">
            <label>Horários disponíveis</label>
            <div class="slots" id="slotsContainer"><p class="form-help">Selecione instrutor e data para ver os horários livres.</p></div>
            <input type="hidden" id="horarioEscolhido">
          </div>

          <button type="submit" class="btn btn-primary btn-block mt-md">Confirmar agendamento</button>
          <div id="agendamentoMsg" class="form-msg"></div>
        </form>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/agendamento.js"></script>
</body>
</html>
